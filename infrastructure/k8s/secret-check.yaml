# Optional ephemeral demonstration. No static credentials or application dependency.
apiVersion: v1
kind: Pod
metadata:
  name: secret-mount-check
  namespace: idealab-research
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: idea-lab-api:0.1.0
      imagePullPolicy: Never
      command: ["python","-c","from pathlib import Path; assert len(Path('/run/credential/token').read_bytes()) >= 32; print('ephemeral mount validated')"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: credential
          mountPath: /run/credential
          readOnly: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
  volumes:
    - name: credential
      secret:
        secretName: ephemeral-demo
        defaultMode: 292
