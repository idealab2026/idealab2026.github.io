<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDEA LAB | Gateway observability</title>
<style>body{font:15px system-ui;background:#f4f6fa;color:#192838;max-width:1150px;margin:32px auto;padding:0 16px}section{background:white;border:1px solid #d5dce5;padding:16px;border-radius:9px;margin:12px 0}table{width:100%;border-collapse:collapse}td,th{padding:9px;text-align:right;border-bottom:1px solid #e6eaf0}td:first-child,th:first-child{text-align:left}input,button{padding:10px;font:inherit}small{color:#54657a}h1{font-size:26px}h2{font-size:18px}.scroll{overflow:auto}</style>
<h1>IDEA LAB · LLM Gateway</h1><p>Local observability · no public traffic claims. Enter the local observer credential; it is not saved.</p>
<input id="key" type="password" autocomplete="off" placeholder="Observer key"><button id="refresh">Refresh metrics</button><p id="status" role="status">No data loaded.</p><div id="out"></div>
<script>
const $=id=>document.getElementById(id);
function node(tag,parent,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;parent.append(n);return n}
function show(v){return v===null||v===undefined?'N/D':typeof v==='number'?Number.isInteger(v)?String(v):v.toFixed(2):String(v)}
function table(root,title,data){const s=node('section',root);node('h2',s,title);const w=node('div',s);w.className='scroll';const t=node('table',w);const fields=['requests','success','errors','error_rate','input_tokens','output_tokens','latency_mean_ms','p50_ms','p95_ms'];const tr=node('tr',t);['Group',...fields].forEach(k=>node('th',tr,k));for(const [k,v] of Object.entries(data)){const r=node('tr',t);node('td',r,k);fields.forEach(f=>node('td',r,f==='error_rate'&&v[f]!=null?show(v[f]*100)+'%':show(v[f])))}}
$('refresh').onclick=async()=>{try{const r=await fetch('/v1/metrics',{headers:{'X-API-Key':$('key').value},cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const m=await r.json();$('out').replaceChildren();$('status').textContent='Scope: '+m.scope+' · measured gateway traffic only';table($('out'),'Totals',{all:m.total});table($('out'),'By project',m.by_project);table($('out'),'By model',m.by_model);table($('out'),'By inference mode',m.by_mode);table($('out'),'Daily history',m.by_day);const s=node('section',$('out'));node('h2',s,'Coverage and limits');for(const k of ['browser_telemetry','availability','resource_usage','rag_quality','benchmark','estimated_total_cost','paid_provider_cost','cost_note'])node('p',s,k+': '+show(m[k]));}catch(e){$('out').replaceChildren();$('status').textContent=e.message}};
</script>
