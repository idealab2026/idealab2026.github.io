name: Institutional LSTM resource and custody validation
on:
  push:
    branches: ['engineering/lstm-resource-20261128']
    paths:
      - 'infrastructure/experiments/midas_lstm/**'
      - '.github/workflows/lstm-resource-ci.yml'
permissions:
  contents: read
concurrency:
  group: lstm-resource-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: infrastructure/experiments/midas_lstm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU frameworks
        run: |
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest==8.3.5
      - name: Verify temporal purge, gradient loop and production custody gate
        run: python -m pytest -q
      - name: Measure independent framework processes
        run: |
          python benchmark.py --synthetic --torch-only --out "$RUNNER_TEMP/torch"
          python benchmark.py --synthetic --keras-only --out "$RUNNER_TEMP/keras"
          python compare_reports.py "$RUNNER_TEMP/torch/report.json" "$RUNNER_TEMP/keras/report.json" "$RUNNER_TEMP/lstm-resource.json"
      - uses: actions/upload-artifact@v4
        with:
          name: lstm-resource-synthetic
          path: ${{ runner.temp }}/lstm-resource.json
          retention-days: 7
