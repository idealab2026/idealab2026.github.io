name: Institutional research API CI
on:
  pull_request:
    paths:
      - 'infrastructure/api/**'
      - '.github/workflows/research-api-ci.yml'
  push:
    branches: ['main']
    paths:
      - 'infrastructure/api/**'
      - '.github/workflows/research-api-ci.yml'
permissions:
  contents: read
concurrency:
  group: research-api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: infrastructure/api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit and ASGI integration tests
        run: python -m pytest -q
      - name: Build and verify non-root container
        run: |
          docker build --tag idea-lab-api:${{ github.sha }} .
          test "$(docker run --rm --entrypoint id idea-lab-api:${{ github.sha }} -u)" = 10001
          docker run -d --name idea-lab-api --read-only --tmpfs /tmp -p 127.0.0.1:8080:8080 idea-lab-api:${{ github.sha }}
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/health
      - name: Real public-data integration
        run: python tests/smoke_public.py
      - name: Stop isolated container
        if: always()
        run: docker rm -f idea-lab-api || true
