name: Institutional isolated LSTM experiment
on:
  pull_request:
    paths:
      - 'infrastructure/experiments/midas_lstm/**'
      - '.github/workflows/lstm-experimental-ci.yml'
permissions:
  contents: read
concurrency:
  group: lstm-experimental-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: infrastructure/experiments/midas_lstm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU frameworks
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pytest==8.3.5
      - name: Test split and gradient loop
        run: python -m pytest -q
      - name: Compare both frameworks and register local runs
        run: python benchmark.py --synthetic --out "$RUNNER_TEMP/lstm" --tracking --source-commit 602f18b5a83b6a6f97987f1143604db4acb8d694
      - name: Preserve synthetic benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: isolated-lstm-smoke
          path: ${{ runner.temp }}/lstm/report.json
          retention-days: 3
