name: Institutional local Kubernetes validation
on:
  push:
    branches: ['engineering/k8s-local-20261128']
    paths:
      - 'infrastructure/k8s/**'
      - '.github/workflows/k8s-local-ci.yml'
permissions:
  contents: read
concurrency:
  group: k8s-local-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.27.0
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.32.2'
      - name: Start isolated cluster and load two image revisions
        run: |
          docker build -t idea-lab-api:0.1.0 infrastructure/api
          docker build --label demo.revision=0.1.1 -t idea-lab-api:0.1.1 infrastructure/api
          kind create cluster --name idea-lab-research --image kindest/node:v1.32.2 --wait 120s
          kind load docker-image --name idea-lab-research idea-lab-api:0.1.0 idea-lab-api:0.1.1
      - name: Verify deployment, service, scale, update, rollback and secret
        run: bash infrastructure/k8s/verify.sh
      - name: Delete cluster
        if: always()
        run: kind delete cluster --name idea-lab-research
