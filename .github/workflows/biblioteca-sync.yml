name: Actualizar catálogo · Biblioteca de Montecristo
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: write
concurrency:
  group: biblioteca-montecristo-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar lector de metadatos públicos
        run: python -m pip install --disable-pip-version-check 'yt-dlp'
      - name: Buscar episodios nuevos en listas existentes
        run: python scripts/sync_biblioteca.py
      - name: Guardar solo cambios verificados
        run: |
          if git diff --quiet -- biblioteca-montecristo/catalogo.json; then
            echo "Sin episodios nuevos; no se crea commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add biblioteca-montecristo/catalogo.json
          git commit -m "Biblioteca: actualizar episodios desde YouTube"
          git push
