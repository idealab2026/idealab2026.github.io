name: Publicar web corporativa IDEA LAB
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '27 5 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar fuentes públicas
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar agregados y separación de cuentas
        run: python3 -m unittest discover -s scripts -p 'test_traffic.py' -v
      - name: Validar catálogo y scripts de la biblioteca
        run: |
          node --check biblioteca-montecristo/app.js
          python3 -m py_compile scripts/sync_biblioteca.py scripts/notebooklm_infografias.py scripts/notebooklm_bridge.py scripts/notebooklm_bridge_launchd.py scripts/notebooklm_source_mapper.py
          python3 -m unittest discover -s scripts -p 'test_notebooklm_bridge.py' -v
          python3 -m unittest discover -s scripts -p 'test_notebooklm_source_mapper.py' -v
          python3 -m unittest discover -s scripts -p 'test_biblioteca.py' -v
      - name: Construir resumen estadístico público
        env:
          IDEALAB_CF_ANALYTICS_TOKEN: ${{ secrets.IDEALAB_CF_ANALYTICS_TOKEN }}
          IDEALAB_CF_ACCOUNT_ID: ${{ secrets.IDEALAB_CF_ACCOUNT_ID }}
        run: python3 scripts/build_traffic.py
      - name: Auditar independencia y artefactos
        run: python3 scripts/validate_public.py
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Crear distribución de lista blanca
        run: |
          mkdir -p dist
          cp index.html stats.js favicon.svg logo-idea-lab.svg icon-180.svg social-preview.svg dist/
          mkdir -p dist/data
          cp data/traffic.json dist/data/traffic.json
          cp data/traffic-snapshot.json dist/data/traffic-snapshot.json
          for site in linea-historia la-telarana biblioteca-montecristo; do
            mkdir -p "dist/$site"
            cp "$site/index.html" "dist/$site/index.html"
          done
          cp linea-historia/data.json dist/linea-historia/data.json
          cp linea-historia/timeline-v4.js dist/linea-historia/timeline-v4.js
          cp la-telarana/one-note-seed.js dist/la-telarana/one-note-seed.js
          cp la-telarana/podcast-vaquero-150.js dist/la-telarana/podcast-vaquero-150.js
          cp la-telarana/podcast-coronel-villarejo-2026.js dist/la-telarana/podcast-coronel-villarejo-2026.js
          cp la-telarana/podcast-coronel-villarejo-2026-revision.js dist/la-telarana/podcast-coronel-villarejo-2026-revision.js
          cp la-telarana/photo-catalog.js dist/la-telarana/photo-catalog.js
          cp la-telarana/layout-seed-v2.js dist/la-telarana/layout-seed-v2.js
          cp la-telarana/graph-3d.js dist/la-telarana/graph-3d.js
          cp biblioteca-montecristo/app.js biblioteca-montecristo/styles.css biblioteca-montecristo/catalogo.json dist/biblioteca-montecristo/
          cp -R biblioteca-montecristo/infografias dist/biblioteca-montecristo/
          test -f dist/biblioteca-montecristo/app.js
          test -f dist/biblioteca-montecristo/styles.css
          test -f dist/biblioteca-montecristo/catalogo.json
          test -f dist/biblioteca-montecristo/infografias/index.json
          test -f dist/linea-historia/index.html
          test -f dist/linea-historia/data.json
          test -s dist/linea-historia/timeline-v4.js
          node --check dist/linea-historia/timeline-v4.js
          grep -q 'src="./timeline-v4.js"' dist/linea-historia/index.html
          test -f dist/la-telarana/index.html
          test -s dist/la-telarana/one-note-seed.js
          grep -q "IDEA_TELARANA_ONENOTE" dist/la-telarana/one-note-seed.js
          test -s dist/la-telarana/podcast-vaquero-150.js
          grep -q "IDEA_TELARANA_PODCAST_150" dist/la-telarana/podcast-vaquero-150.js
          test -s dist/la-telarana/podcast-coronel-villarejo-2026.js
          node --check dist/la-telarana/podcast-coronel-villarejo-2026.js
          test -s dist/la-telarana/podcast-coronel-villarejo-2026-revision.js
          node --check dist/la-telarana/podcast-coronel-villarejo-2026-revision.js
          grep -q "v2-exhaustiva-20261109" dist/la-telarana/podcast-coronel-villarejo-2026-revision.js
          grep -q "IDEA_TELARANA_PODCAST_CORONEL_VILLAREJO" dist/la-telarana/podcast-coronel-villarejo-2026.js
          test -s dist/la-telarana/photo-catalog.js
          grep -q "IDEA_TELARANA_WIKIPEDIA_PORTRAITS" dist/la-telarana/photo-catalog.js
          test -s dist/la-telarana/layout-seed-v2.js
          grep -q "IDEA_TELARANA_LAYOUT_V2" dist/la-telarana/layout-seed-v2.js
          test -s dist/la-telarana/graph-3d.js
          node --check dist/la-telarana/graph-3d.js
          grep -q 'src="./graph-3d.js' dist/la-telarana/index.html
          test -f dist/biblioteca-montecristo/index.html
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 6
          test -f dist/data/traffic.json
          test -f dist/data/traffic-snapshot.json
      - name: Empaquetar web corporativa
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
