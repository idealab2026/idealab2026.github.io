name: Publicar web corporativa IDEA LAB
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '27 5 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar fuentes públicas
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar agregados y separación de cuentas
        run: python3 -m unittest discover -s scripts -p 'test_traffic.py' -v
      - name: Validar catálogo y scripts de la biblioteca
        run: |
          node --check biblioteca-montecristo/app.js
          python3 -m py_compile scripts/sync_biblioteca.py scripts/notebooklm_infografias.py scripts/notebooklm_bridge.py scripts/notebooklm_bridge_launchd.py scripts/notebooklm_source_mapper.py scripts/notebooklm_map_catalog.py scripts/notebooklm_export_desktop.py scripts/notebooklm_export_all.py scripts/export_telarana_sources.py
          python3 -m unittest discover -s scripts -p 'test_notebooklm_bridge.py' -v
          python3 -m unittest discover -s scripts -p 'test_notebooklm_source_mapper.py' -v
          python3 -m unittest discover -s scripts -p 'test_notebooklm_map_catalog.py' -v
          python3 -m unittest discover -s scripts -p 'test_notebooklm_export_desktop.py' -v
          python3 -m unittest discover -s scripts -p 'test_notebooklm_export_all.py' -v
          python3 -m unittest discover -s scripts -p 'test_biblioteca.py' -v
      - name: Validar distribución 3D y gestos de zoom
        run: node scripts/test_telarana_3d.mjs
      - name: Validar biografías independientes y testimonios
        run: node scripts/test_telarana_person_bios.mjs
      - name: Validar integración documental entre La Telaraña y Línea de la Historia
        run: node scripts/test_telarana_timeline.mjs
      - name: Validar tabla de progreso de fuentes
        run: node scripts/test_telarana_source_progress.mjs
      - name: Validar fuentes 18 y 21, Lorenzo y presencia en Pages
        run: node scripts/test_telarana_recent_sources.mjs
      - name: Comprobar Peter Thiel y sus dos entrevistas en ficha única
        run: node scripts/test_telarana_peter_thiel.mjs
      - name: Comprobar biografías y atribuciones de las fuentes 18 y 21
        run: node scripts/test_telarana_source_profile_reports.mjs
      - name: Validar personas y testimonios de fuentes 09 y 10
        run: node scripts/test_telarana_source_profile_09_10.mjs
      - name: Validar biografías y declaraciones de fuentes 11 y 12
        run: node scripts/test_telarana_source_profiles_11_12.mjs
      - name: Verificar perfiles atribuidos y eventos históricos de fuente 13
        run: node scripts/test_telarana_source13_profiles.mjs
      - name: Verificar perfiles y contraste numérico de fuente 14
        run: node scripts/test_telarana_source14_profiles.mjs
      - name: Validar fuente primaria 15 y su trazabilidad
        run: node scripts/test_telarana_source15.mjs
      - name: Validar atribuciones personales en fuente 16
        run: node scripts/test_telarana_source16_profiles.mjs
      - name: Auditar crecimiento de entidades y presencia de todas las fuentes
        run: node scripts/test_telarana_load_audit.mjs
      - name: Validar transcripción y evidencias de la fuente 02
        run: node scripts/test_telarana_source02_transcript.mjs
      - name: Validar avance de fuente 03 y fotografías de sus protagonistas
        run: node scripts/test_telarana_source03.mjs
      - name: Validar fuente 04 · antecedentes históricos y enlaces documentales
        run: node scripts/test_telarana_source04.mjs
      - name: Validar procedencia y cautelas de fuente 05 · mapa político
        run: node scripts/test_telarana_source05.mjs
      - name: Validar fuente 06 · transcript indexado y relaciones cualificadas
        run: node scripts/test_telarana_source06.mjs
      - name: Validar fuente 07 · periodismo, notas y cinco hitos históricos
        run: node scripts/test_telarana_source07.mjs
      - name: Validar fuente 08 · menciones editoriales y contexto judicial sin imputaciones
        run: node scripts/test_telarana_source08.mjs
      - name: Construir resumen estadístico público
        env:
          IDEALAB_CF_ANALYTICS_TOKEN: ${{ secrets.IDEALAB_CF_ANALYTICS_TOKEN }}
          IDEALAB_CF_ACCOUNT_ID: ${{ secrets.IDEALAB_CF_ACCOUNT_ID }}
        run: python3 scripts/build_traffic.py
      - name: Auditar independencia y artefactos
        run: python3 scripts/validate_public.py
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Crear distribución de lista blanca
        run: |
          mkdir -p dist
          cp index.html stats.js favicon.svg logo-idea-lab.svg icon-180.svg social-preview.svg dist/
          mkdir -p dist/data
          cp data/traffic.json dist/data/traffic.json
          cp data/traffic-snapshot.json dist/data/traffic-snapshot.json
          for site in linea-historia la-telarana biblioteca-montecristo; do
            mkdir -p "dist/$site"
            cp "$site/index.html" "dist/$site/index.html"
          done
          cp linea-historia/data.json dist/linea-historia/data.json
          cp linea-historia/country-links.json dist/linea-historia/country-links.json
          cp linea-historia/world-110m.json dist/linea-historia/world-110m.json
          cp linea-historia/estudios-telarana.json dist/linea-historia/estudios-telarana.json
          cp linea-historia/timeline-v4.js dist/linea-historia/timeline-v4.js
          cp linea-historia/favicon.png dist/linea-historia/favicon.png
          test -s dist/linea-historia/favicon.png
          cp la-telarana/one-note-seed.js dist/la-telarana/one-note-seed.js
          cp la-telarana/podcast-vaquero-150.js dist/la-telarana/podcast-vaquero-150.js
          cp la-telarana/investigacion-frattini-contexto.js dist/la-telarana/investigacion-frattini-contexto.js
          cp la-telarana/podcast-coronel-villarejo-2026.js dist/la-telarana/podcast-coronel-villarejo-2026.js
          cp la-telarana/podcast-coronel-villarejo-2026-revision.js dist/la-telarana/podcast-coronel-villarejo-2026-revision.js
          cp la-telarana/podcast-coronel-elecciones-2026-preliminar.js dist/la-telarana/podcast-coronel-elecciones-2026-preliminar.js
          cp la-telarana/podcast-coronel-elecciones-2026-transcript-review.js dist/la-telarana/podcast-coronel-elecciones-2026-transcript-review.js
          cp la-telarana/podcast-vaquero-145-editorial.js dist/la-telarana/podcast-vaquero-145-editorial.js
          cp la-telarana/podcast-duque-lerma-historia.js dist/la-telarana/podcast-duque-lerma-historia.js
          cp la-telarana/source05-psoe-map-context.js dist/la-telarana/source05-psoe-map-context.js
          cp la-telarana/podcast-wild-253-villarejo.js dist/la-telarana/podcast-wild-253-villarejo.js
          cp la-telarana/podcast-wild-312-chicote.js dist/la-telarana/podcast-wild-312-chicote.js
          cp la-telarana/podcast-vaquero-67-villarejo.js dist/la-telarana/podcast-vaquero-67-villarejo.js
          # NUEVAS FUENTES EXPLICITAMENTE AUTORIZADAS para publicar (sin transcripciones ni seguimiento privado).
          cp la-telarana/fuente-09-villarejo-revision.js dist/la-telarana/fuente-09-villarejo-revision.js
          cp la-telarana/fuente-15-estrategia-seguridad-2025.js dist/la-telarana/fuente-15-estrategia-seguridad-2025.js
          for n in 10 11 12 13 14 16 17 19 20 22 23 24 25; do
            cp "la-telarana/fuente-${n}-revision-inicial.js" "dist/la-telarana/fuente-${n}-revision-inicial.js"
          done
          cp la-telarana/fuente-18-epstein-lorenzo-editorial.js dist/la-telarana/fuente-18-epstein-lorenzo-editorial.js
          cp la-telarana/fuente-21-orden-mundial-editorial.js dist/la-telarana/fuente-21-orden-mundial-editorial.js
          cp la-telarana/photo-catalog.js dist/la-telarana/photo-catalog.js
          cp la-telarana/personas-fuentes-18-21.js dist/la-telarana/personas-fuentes-18-21.js
          cp la-telarana/personas-fuentes-09-10.js dist/la-telarana/personas-fuentes-09-10.js
          cp la-telarana/personas-fuentes-11-12.js dist/la-telarana/personas-fuentes-11-12.js
          cp la-telarana/personas-fuentes-13.js dist/la-telarana/personas-fuentes-13.js
          cp la-telarana/personas-fuentes-14.js dist/la-telarana/personas-fuentes-14.js
          cp la-telarana/personas-fuentes-16.js dist/la-telarana/personas-fuentes-16.js
          cp la-telarana/person-biographies.js dist/la-telarana/person-biographies.js
          cp la-telarana/layout-seed-v2.js dist/la-telarana/layout-seed-v2.js
          cp la-telarana/graph-3d.js dist/la-telarana/graph-3d.js
          cp biblioteca-montecristo/app.js biblioteca-montecristo/styles.css biblioteca-montecristo/catalogo.json dist/biblioteca-montecristo/
          cp -R biblioteca-montecristo/infografias dist/biblioteca-montecristo/
          test -f dist/biblioteca-montecristo/app.js
          test -f dist/biblioteca-montecristo/styles.css
          test -f dist/biblioteca-montecristo/catalogo.json
          test -f dist/biblioteca-montecristo/infografias/index.json
          test -f dist/linea-historia/index.html
          test -f dist/linea-historia/data.json
          test -s dist/linea-historia/estudios-telarana.json
          test -s dist/linea-historia/timeline-v4.js
          node --check dist/linea-historia/timeline-v4.js
          grep -q 'src="./timeline-v4.js' dist/linea-historia/index.html
          test -f dist/la-telarana/index.html
          grep -q 'id="load-audit"' dist/la-telarana/index.html
          grep -q 'Versión de auditoría 2026-11-10' dist/la-telarana/index.html
          test -s dist/la-telarana/one-note-seed.js
          grep -q "IDEA_TELARANA_ONENOTE" dist/la-telarana/one-note-seed.js
          test -s dist/la-telarana/podcast-vaquero-150.js
          grep -q "IDEA_TELARANA_PODCAST_150" dist/la-telarana/podcast-vaquero-150.js
          test -s dist/la-telarana/investigacion-frattini-contexto.js
          node --check dist/la-telarana/investigacion-frattini-contexto.js
          grep -q "IDEA_TELARANA_FRATTINI_EXTERNAL" dist/la-telarana/investigacion-frattini-contexto.js
          test -s dist/la-telarana/podcast-coronel-villarejo-2026.js
          node --check dist/la-telarana/podcast-coronel-villarejo-2026.js
          test -s dist/la-telarana/podcast-coronel-villarejo-2026-revision.js
          node --check dist/la-telarana/podcast-coronel-villarejo-2026-revision.js
          test -s dist/la-telarana/podcast-coronel-elecciones-2026-preliminar.js
          node --check dist/la-telarana/podcast-coronel-elecciones-2026-preliminar.js
          grep -q "documentacion_contextual_inicial" dist/la-telarana/podcast-coronel-elecciones-2026-preliminar.js
          test -s dist/la-telarana/podcast-coronel-elecciones-2026-transcript-review.js
          node --check dist/la-telarana/podcast-coronel-elecciones-2026-transcript-review.js
          grep -q "IDEA_TELARANA_CEUTA_TRANSCRIPT_REVIEW" dist/la-telarana/index.html
          test -s dist/la-telarana/podcast-vaquero-145-editorial.js
          node --check dist/la-telarana/podcast-vaquero-145-editorial.js
          grep -q 'IDEA_TELARANA_SOURCE03_EDITORIAL' dist/la-telarana/index.html
          test -s dist/la-telarana/podcast-duque-lerma-historia.js
          node --check dist/la-telarana/podcast-duque-lerma-historia.js
          grep -q 'IDEA_TELARANA_SOURCE04_HISTORICAL' dist/la-telarana/index.html
          test -s dist/la-telarana/source05-psoe-map-context.js
          node --check dist/la-telarana/source05-psoe-map-context.js
          grep -q 'IDEA_TELARANA_SOURCE05_EDITORIAL' dist/la-telarana/index.html
          test -s dist/la-telarana/podcast-wild-253-villarejo.js
          node --check dist/la-telarana/podcast-wild-253-villarejo.js
          grep -q 'IDEA_TELARANA_SOURCE06_PODCAST' dist/la-telarana/index.html
          test -s dist/la-telarana/podcast-wild-312-chicote.js
          node --check dist/la-telarana/podcast-wild-312-chicote.js
          grep -q 'IDEA_TELARANA_SOURCE07_PODCAST' dist/la-telarana/index.html
          test -s dist/la-telarana/podcast-vaquero-67-villarejo.js
          node --check dist/la-telarana/podcast-vaquero-67-villarejo.js
          grep -q 'IDEA_TELARANA_SOURCE08_EDITORIAL' dist/la-telarana/index.html
          grep -q "v2-exhaustiva-20261109" dist/la-telarana/podcast-coronel-villarejo-2026-revision.js
          grep -q "IDEA_TELARANA_PODCAST_CORONEL_VILLAREJO" dist/la-telarana/podcast-coronel-villarejo-2026.js
          test -s dist/la-telarana/photo-catalog.js
          test -s dist/la-telarana/person-biographies.js
          node --check dist/la-telarana/person-biographies.js
          node --check dist/la-telarana/personas-fuentes-18-21.js
          node --check dist/la-telarana/personas-fuentes-09-10.js
          node --check dist/la-telarana/personas-fuentes-11-12.js
          grep -q 'IDEA_TELARANA_BIOGRAPHIES' dist/la-telarana/person-biographies.js
          grep -q 'showPersonBiography' dist/la-telarana/index.html
          grep -q "IDEA_TELARANA_WIKIPEDIA_PORTRAITS" dist/la-telarana/photo-catalog.js
          test -s dist/la-telarana/layout-seed-v2.js
          grep -q "IDEA_TELARANA_LAYOUT_V2" dist/la-telarana/layout-seed-v2.js
          test -s dist/la-telarana/graph-3d.js
          node --check dist/la-telarana/graph-3d.js
          # Ninguna versión puede publicarse con scripts locales referenciados pero ausentes.
          node -e 'const fs=require("fs");const html=fs.readFileSync("dist/la-telarana/index.html","utf8");const names=[...html.matchAll(/<script[^>]*src="([^"]+)"/g)].map(m=>m[1]).filter(n=>n.startsWith("./")&&n.includes(".js")).map(n=>n.slice(2).split("?")[0]);if(names.length<20)throw Error("Lista de scripts inesperadamente corta: "+names.length);const missing=names.filter(n=>!fs.existsSync("dist/la-telarana/"+n));if(missing.length){console.error("Scripts de La Telaraña ausentes en Pages:",missing.join(", "));process.exit(1)}console.log("OK: "+names.length+" scripts referenciados y presentes")'
          for f in dist/la-telarana/fuente-*.js; do node --check "$f"; done
          grep -q 'src="./graph-3d.js' dist/la-telarana/index.html
          mkdir -p dist/icsa
          cp icsa/index.html icsa/privacidad.html dist/icsa/
          test -s dist/icsa/index.html
          test -s dist/icsa/privacidad.html
          test -f dist/biblioteca-montecristo/index.html
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 6
          test -f dist/data/traffic.json
          test -f dist/data/traffic-snapshot.json
      - name: Empaquetar web corporativa
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
