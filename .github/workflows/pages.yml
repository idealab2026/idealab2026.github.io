name: Publicar web corporativa IDEA LAB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar fuentes públicas
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Auditar independencia y artefactos
        run: python3 scripts/validate_public.py
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Crear distribución de lista blanca
        run: |
          mkdir -p dist
          cp index.html favicon.svg logo-idea-lab.svg icon-180.svg social-preview.svg dist/
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 5
      - name: Empaquetar web corporativa
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
